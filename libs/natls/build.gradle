dependencies {
    implementation libs.lsp4j
    implementation libs.reflections
	implementation libs.slf4j.utillogging
    implementation project(':natparse')
    implementation project(':natlint')
    implementation project(':natgen')

    testImplementation project(':testhelpers')
    testImplementation libs.slf4j.nop
    testImplementation libs.testing.awaitility
}

tasks.register('fatJar', Jar) {
    manifest {
        attributes(
                'Main-Class': 'org.amshove.natls.NatLs',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }
    archiveFileName = 'natls.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn(':natparse:jar', ':natlint:jar', ':natgen:jar')
    from {configurations.runtimeClasspath.collect { (it.isDirectory() ? it : zipTree(it)).matching { exclude "**/*.SF", "**/*.DSA", "**/*.RSA" } } }
    with jar
}

configurations.testImplementation {
    exclude group: 'org.slf4j', module: 'slf4j-jdk14'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'org.amshove.natls.NatLs',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}

artifacts {
    jar
}
